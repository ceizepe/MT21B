<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT21B – Oznamy</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="daily.css">
</head>
<body>
<div class="bg-watermark" aria-hidden="true"></div>
<nav class="topbar">
<div class="brand"><img src="brose-logo-brose-fahrzeugteile-gmbh-co-k-11563170547fgficxf1fi.png" class="brand-logo" alt="Brose logo"><h2>Oznamy</h2></div>
<div class="user-bar"><span id="dailyUser"></span><button id="backBtn" type="button">Späť</button></div>
</nav>
<main class="daily-page">
<section class="daily-toolbar"><label>Dátum<input id="noticeDate" type="date"></label></section>
<section class="daily-panel">
<h2>Nový oznam</h2>
<form id="announcementForm" class="announcement-form">
<select id="noticeTarget"><option value="all">Všetci</option><option value="line">Konkrétna linka</option><option value="person">Konkrétny človek</option></select>
<select id="noticeTargetValue"></select>
<textarea id="noticeText" required placeholder="Text oznamu"></textarea>
<button class="primary-btn">Pridať oznam</button>
</form>
</section>
<section class="daily-panel"><h2>Aktívne oznamy</h2><div id="announcementList"></div></section>
<section class="daily-panel"><h2>Potvrdenia prečítania</h2><p>Potvrdenie zostane uložené, kým oznam nezmeníš, nepridáš nový alebo ho ručne nezrušíš.</p><div id="readList"></div></section>
</main>
<script type="module" src="daily.js"></script>
</body>
</html>
