<!DOCTYPE html>
<html lang="sk">

<head>
<meta charset="UTF-8">
<title>
MT21B Workforce Manager – Prihlásenie
</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg-watermark" aria-hidden="true"></div>

<div class="login-container">

<div class="auth-header">
<img src="brose-logo-brose-fahrzeugteile-gmbh-co-k-11563170547fgficxf1fi.png" alt="Brose logo" class="auth-logo">
<h2 id="authTitle">Prihlásenie</h2>
</div>

<div class="auth-tabs">
<button type="button" id="tabLogin" class="auth-tab active">Prihlásiť sa</button>
<button type="button" id="tabRegister" class="auth-tab">Registrovať</button>
</div>

<form id="authForm">

<div id="registerFields" style="display: none;">
<input type="text" id="regName" placeholder="Meno a priezvisko (nepovinné)">
</div>

<input type="text" id="authEmail" placeholder="Prihlasovacia skratka (napr. pceizel)" required>

<input type="password" id="authPassword" placeholder="Heslo" required>

<div id="confirmPasswordWrap" style="display: none;">
<input type="password" id="regPasswordConfirm" placeholder="Potvrď heslo">
</div>

<button type="submit" id="authSubmitBtn" class="primary-btn">
Prihlásiť sa
</button>

</form>

<p id="authMessage" class="auth-message" style="display: none;"></p>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
