<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">

  <title>MT21B Dashboard</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lines-layout.css">
  <link rel="stylesheet" href="calendar.css">
</head>

<body>

  <div class="bg-watermark" aria-hidden="true"></div>

  <nav class="topbar">

    <div class="brand">

      <img
        src="brose-logo-brose-fahrzeugteile-gmbh-co-k-11563170547fgficxf1fi.png"
        alt="Brose logo"
        class="brand-logo"
      >

      <h2>MT21B Workforce Manager</h2>

    </div>

    <div class="user-bar">

      <span id="currentUser">Načítavam...</span>

      <span
        id="roleBadge"
        class="role-badge"
      ></span>

      <button
        id="logoutBtn"
        type="button"
      >
        Odhlásiť
      </button>

    </div>

  </nav>

  <div
    id="overviewSection"
    class="cards"
  >

    <div
      id="employeesCard"
      class="card clickable-card"
      data-section="employees"
    >
      <h3>Zamestnanci</h3>
      <p id="employeeCount">0</p>
    </div>

    <div
      id="calendarCard"
      class="card clickable-card"
      data-section="calendar"
    >
      <h3>Pracovný kalendár</h3>
      <p id="calendarCardText">Moje zmeny</p>
    </div>

    <div
      id="usersCard"
      class="card clickable-card"
      data-section="users"
      style="display: none;"
    >
      <h3>Používatelia</h3>
      <p id="userCount">0</p>
    </div>

    <div
      class="card clickable-card"
      data-section="lines"
    >
      <h3>Linky</h3>
      <p id="linesCount">0</p>
    </div>

    <div
      class="card clickable-card"
      data-section="absences"
    >
      <h3>Neprítomnosti</h3>
      <p>Dovolenky, PN a paragrafy</p>
    </div>

  </div>

  <div
    id="detailSection"
    class="detail-panel"
    style="display: none;"
  >

    <div class="detail-header">

      <button
        id="backToOverviewBtn"
        type="button"
        class="secondary-btn"
      >
        ← Späť na prehľad
      </button>

      <h2 id="detailTitle">Detail</h2>

    </div>

    <!-- ZAMESTNANCI -->

    <div
      id="employeesView"
      style="display: none;"
    >

      <p
        id="employeeRoleNotice"
        class="role-notice"
