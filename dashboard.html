<!DOCTYPE html>
<html lang="sk">

<head>

<meta charset="UTF-8">

<title>
MT21B Dashboard
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="bg-watermark" aria-hidden="true"></div>

<nav class="topbar">

<div class="brand">
<img src="brose-logo-brose-fahrzeugteile-gmbh-co-k-11563170547fgficxf1fi.png" alt="Brose logo" class="brand-logo">
<h2>MT21B Workforce Manager</h2>
</div>

<div class="user-bar">
<span id="currentUser">Načítavam...</span>
<button id="logoutBtn" type="button">
Odhlásiť
</button>
</div>

</nav>

<div id="overviewSection" class="cards">

<div class="card clickable-card" data-section="employees">
<h3>Zamestnanci</h3>
<p id="employeeCount">0</p>
</div>

<div class="card clickable-card" data-section="users">
<h3>Používatelia</h3>
<p id="userCount">0</p>
</div>

<div class="card clickable-card" data-section="groups">
<h3>Skupiny</h3>
<p>8</p>
</div>

</div>

<div id="detailSection" class="detail-panel" style="display: none;">

<div class="detail-header">
<button id="backToOverviewBtn" type="button" class="secondary-btn">← Späť na prehľad</button>
<h2 id="detailTitle">Detail</h2>
</div>

<div id="employeesView" style="display: none;">

<form id="addEmployeeForm" class="employee-form">
<input type="text" id="empPersonalNumber" placeholder="Osobné číslo" required>
<input type="text" id="empFirstName" placeholder="Meno" required>
<input type="text" id="empLastName" placeholder="Priezvisko" required>
<input type="tel" id="empPhone" placeholder="Telefónne číslo" required>
<button type="submit" class="primary-btn">Pridať</button>
</form>

<div class="table-wrap">
<table class="data-table">
<thead>
<tr>
<th>Osobné číslo</th>
<th>Meno</th>
<th>Priezvisko</th>
<th>Telefónne číslo</th>
<th>Akcia</th>
</tr>
</thead>
<tbody id="employeesTableBody">
<tr>
<td colspan="5">Načítavam zamestnancov...</td>
</tr>
</tbody>
</table>
</div>

</div>

<div id="usersView" style="display: none;">
<p>Zoznam používateľov (aktuálne v databáze: <strong id="usersDetailCount">0</strong>).</p>
</div>

<div id="groupsView" style="display: none;">
<p>Počet definovaných skupín: <strong>8</strong>.</p>
</div>

</div>

<script type="module"
src="dashboard.js">
</script>

</body>

</html>
